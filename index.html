<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="Profile-card">

  <div class="info-box">
    <img src="ken.jpg" alt="">
    
    <div class="info">
      <h2>Keenan athallah</h2>
      <p>Web developer</p>
    </div>
  </div>

  <div class="number-grid">
    <div class="box">
      <p>2010</p>
      <p>Posts</p>
    </div>
    <div class="box">
      <p>301k</p>
      <p>Followers</p>
    </div>
    <div class="box">
      <p>3</p>
      <p>Following</p>
    </div>

  </div>

    <div class="btn-box">
        <button class="follow">Follow</button>
        <button class="message">Message</button>
     </div>

  </div>
</body>
</html>
